
spring.application.name=engineering-operations-platform

spring.datasource.url=jdbc:postgresql://localhost:5432/eop_db
spring.datasource.username=postgres
spring.datasource.password=eop_password
spring.jpa.hibernate.ddl-auto=validate

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Platform Config
eop.instance-id=local-dev-01
eop.environment=local

# Database Config (Mapping to existing Spring properties)
eop.database.url=${spring.datasource.url}
eop.database.username=${spring.datasource.username}
eop.database.password=${spring.datasource.password}
eop.database.max-pool-size=10
eop.database.connection-timeout-ms=30000
eop.database.auto-migrate=true

# Security Config (Secret must be 32+ chars)
eop.security.jwt-secret=super_secret_local_development_key_12345
eop.security.jwt-issuer=eop-local
eop.security.token-validity-seconds=3600
eop.security.refresh-token-validity-seconds=86400

# Kafka Config (Placeholders for Phase 5)
eop.kafka.bootstrap-servers=localhost:9092
eop.kafka.consumer-group-id=eop-local-group
eop.kafka.producer-retries=3
eop.kafka.request-timeout-ms=5000

# Feature Toggles
eop.features.auto-incident-creation-enabled=true
eop.features.rag-knowledge-enabled=false
eop.features.kafka-distribution-enabled=false